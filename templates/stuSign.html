<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign your carrer</title>
    <link rel="stylesheet" href="../static/stusign.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div id="main" >
        <div id="canva" >
            <div class="card shadow-lg p-4">
                <div class="mb-3"></div>
                    <h4 class="card-title text-center mb-4">Signin</h4>
                    <form class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Student_name</label>
                            <input type="text" class="form-control" id="name" name="name">
                        </div>
                        <div class="col-md-6">
                            <label for="id" class="form-label">student_id</label>
                            <input type="text"  class="form-control" id="id" name="id">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">email</label>
                            <input type="email"  class="form-control" id="email" name="email">
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label">Password</label>
                            <input type="Password"  class="form-control" id="password" name="password">
                        </div>
                        <div class="col-12">
                            <label for="education" class="form-label">education</label>
                            <input type="text" class="form-control" id="education" name="education" placeholder="be/btech etc">
                        </div>
                        <div class="col-12">
                            <label for="contact" class="form-label">contact</label>
                            <input type="text" class="form-control" id="contact" name="contact" placeholder="1236">
                        </div>
                        
                        <div class="col-10">
                            <button type="submit" class="btn btn-primary">Sign in</button>
                        </div>
                    </form>
                </div>    
            </div>        
        </div>
    </div>
</body>
</html>
